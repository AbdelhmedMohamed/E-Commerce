
<div class="container">
    

<form (ngSubmit)="adressFormSubmit()" [formGroup]="adressForm">
    <div class="mt-3"  >
        <label for=""> Details : </label>
        <input formControlName="details" class="form-control" >
    </div>

    <div  class="mt-3" >
        <label for=""> phone : </label>
        <input formControlName="phone" class="form-control" >
    </div>
    <div class="mt-3" >
        <label for=""> city : </label>
        <input formControlName="city" class="form-control" >
    </div>
    <button type="submit" class="btn btn-success mt-3">Pay</button>
</form>

</div>
