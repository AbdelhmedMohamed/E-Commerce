

<div class="container">
   
<div class="row my-5 align-items-center " >
    <div class="col-md-3">
        
       
        <owl-carousel-o [options]="customOptions">
          <ng-template carouselSlide><img class="w-100" [src]="oneProduct?.imageCover" ></ng-template>  
          <ng-template carouselSlide><img class="w-100" [src]="oneProduct?.imageCover" ></ng-template>  
          <ng-template carouselSlide><img class="w-100" [src]="oneProduct?.imageCover" ></ng-template>  
          
        </owl-carousel-o>
       




    </div>
    <div class="col-md-9">
        <h1 class="h4">{{oneProduct?.title}}</h1>
        <h1 class="h4">{{oneProduct?.description}}</h1>

        <span class="fa-sm text-main">{{oneProduct?.category?.name}}</span>
       
        <div class="d-flex justify-content-between">
            <span>{{oneProduct.price}}EGP</span>

            <span><i class="fa-solid fa-star rating-color"></i>{{oneProduct.ratingsAverage}}</span>
    </div>
    

    <button (click)="addToCartBTN(oneProduct._id)"  class="btn bg-main text-white d-block w-100 my-2">Add</button>

</div>
  

</div>
